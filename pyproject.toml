[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanops-openenv"
version = "1.0.0"
description = "A multi-task AI agent environment for data cleaning."
authors = [{ name = "Vikhil Ravella" }]
# THE GRADER ASKED FOR THIS SPECIFIC DEPENDENCY:
dependencies = [
    "fastapi",
    "uvicorn",
    "pandas",
    "pydantic",
    "python-dotenv",
    "openenv-core>=0.2.0"
]
requires-python = ">=3.9"

# THE GRADER ASKED FOR THIS ENTRY POINT:
[project.scripts]
server = "app:app"

[tool.setuptools]
packages = ["."]
[project.scripts]
server = "server.app:main"
