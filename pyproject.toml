[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanops-openenv"
version = "1.0.0"
description = "A multi-task AI agent environment for data cleaning."
authors = [
    { name = "Vikhil Ravella" }
]
dependencies = [
    "fastapi",
    "uvicorn",
    "pandas",
    "pydantic",
    "python-dotenv"
]
requires-python = ">=3.9"

[tool.setuptools]
packages = ["."]
