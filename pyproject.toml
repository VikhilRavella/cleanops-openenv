[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "cleanops-openenv"
version = "1.0.0"
description = "Multi-task AI agent environment for real-world data cleaning benchmarks"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.7.1",
    "pandas==2.2.2",
    "python-dotenv==1.0.1",
    "openai==1.30.1",
]

[project.optional-dependencies]
dev = ["httpx", "pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
where = ["."]
